<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&display=swap" rel="stylesheet">    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class="counter-box"><p id="Home">11</p></div>
                <div class="buttons-box">
                    <button id="Hadd1" onclick="HomeAdd1()">+1</button>
                    <button id="Hadd2" onclick="HomeAdd2()">+2</button>
                    <button id="Hadd3" onclick="HomeAdd3()">+3</button>
                </div>
                <div class="reset-button">
                    <button onclick="reset()">Reset</button>
                </div>
            </div>
            <div>
                <div>
                <h3>GUEST</h3>
                <div class="counter-box"><p id="Guest">5</p></div>
                <div class="buttons-box">
                    <button id="Gadd1" onclick="GuestAdd1()">+1</button>
                    <button id="Gadd2" onclick="GuestAdd2()">+2</button>
                    <button id="Gadd3" onclick="GuestAdd3()">+3</button>
                </div>
                <div class="reset-button">
                    <button>Reset</button>
                </div>
            </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
